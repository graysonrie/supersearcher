<div class="container">
  <div class="setting-row">
    <div class="setting-info">
      <div class="icon setting-title">
        <iconify-icon icon="folder" />
        <p><b>Index directories on click</b></p>
      </div>
      <p class="description">
        When enabled, clicking a directory adds it to the indexing queue.
      </p>
    </div>

    <label class="switch">
      <input
        type="checkbox"
        [checked]="addDirectoriesToCrawlerQueueOnClick"
        (change)="onToggle($any($event.target).checked)"
      />
      <span class="switch-slider"></span>
    </label>
  </div>
</div>
